<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hoarder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #faf9f7;
        --surface: #fff;
        --border: #e8e5e1;
        --text: #1a1a1a;
        --muted: #8a8580;
        --accent: #e8590c;
        --accent-hover: #d9480f;
        --success: #0a7f2e;
        --success-bg: #e6f9ed;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: var(--bg); color: var(--text);
        margin: 0; padding: 16px 18px; width: 320px;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700; letter-spacing: -0.5px;
        font-size: 20px; margin: 0 0 16px;
      }

      /* Loading spinner */
      .loading { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
      .spinner {
        width: 18px; height: 18px;
        border: 2.5px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      .loading-text { font-size: 13px; color: var(--muted); }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Success card */
      .success-card {
        margin: 24px 0;
        display: flex; align-items: flex-start; gap: 10px;
        animation: slideIn 0.25s ease-out;
      }
      .check-icon {
        width: 22px; height: 22px; flex-shrink: 0;
        background: var(--success);
        border-radius: 50%;
        display: grid; place-items: center;
        animation: popCheck 0.35s ease-out 0.1s both;
      }
      .check-icon svg { width: 12px; height: 12px; }
      .success-text { font-size: 13px; font-weight: 500; color: var(--success); }
      .success-url {
        font-size: 12px; color: var(--muted);
        margin-top: 3px; word-break: break-all;
        display: -webkit-box; -webkit-line-clamp: 2;
        -webkit-box-orient: vertical; overflow: hidden;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popCheck {
        0% { transform: scale(0); }
        60% { transform: scale(1.2); }
        100% { transform: scale(1); }
      }

      /* States */
      .status { font-size: 13px; margin-bottom: 14px; color: var(--muted); }
      .status.err { color: #b00020; }
      .url {
        font-size: 12px; color: var(--text);
        word-break: break-all; margin-bottom: 14px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px;
      }

      .actions { display: flex; gap: 8px; }
      button {
        padding: 8px 16px; border-radius: 9999px;
        font-size: 13px; font-weight: 600; cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .btn-primary { background: var(--accent); color: #fff; border: none; }
      .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
      .btn-secondary {
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup.tsx"></script>
  </body>
</html>
